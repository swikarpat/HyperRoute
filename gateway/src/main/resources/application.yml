server:
  port: 8080

spring:
  application:
    name: hyperroute-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      routes:
        # Route 1: Orders (Standard L7 Reverse Proxy)
        - id: orders-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@apiKeyResolver}"

        # Route 2: Faulty Payments (Circuit Breaker & Fallback Test)
        - id: payments-fault-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentsCircuitBreaker
                fallbackUri: forward:/fallback/payments

resilience4j:
  circuitbreaker:
    instances:
      paymentsCircuitBreaker:
        slidingWindowSize: 6
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: true
      adkAgentService:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: true

hyperroute:
  agent-runtime-url: ${AGENT_RUNTIME_URL:http://localhost:8000}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
