services:
  # 1. Distributed Cache & Token Bucket
  redis:
    image: redis:7-alpine
    container_name: hyperroute-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 2. Apache Kafka 3.7 KRaft Event Log
  kafka:
    image: apache/kafka:3.7.0
    container_name: hyperroute-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  # 3. Open-Source AWS Moto Server (Secrets Manager & S3)
  moto:
    image: motoserver/moto:latest
    container_name: hyperroute-moto
    ports:
      - "4566:4566"
    restart: unless-stopped

  # 4. Distributed Tracing Backend
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hyperroute-jaeger
    ports:
      - "16686:16686" # Web UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # 5. OpenTelemetry Collector (W3C Trace Pipeline)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hyperroute-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger
    restart: unless-stopped
