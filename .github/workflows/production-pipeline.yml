name: HyperRoute Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Java 21 Spring Cloud Gateway & Banking Core Service Testing
  # --------------------------------------------------------------------------
  gateway-test:
    name: Gateway & Banking Core Unit and Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Execute Gateway & Banking Core Tests
        env:
          SPRING_DATA_REDIS_HOST: localhost
        run: ./gradlew test --no-daemon

  # --------------------------------------------------------------------------
  # 2. Python 3.14 Agent Runtime Testing
  # --------------------------------------------------------------------------
  agent-runtime-test:
    name: Python Agent Runtime & FSM Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-runtime/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: pytest tests/ -v

  # --------------------------------------------------------------------------
  # 3. Mission Control React Frontend Verification
  # --------------------------------------------------------------------------
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # --------------------------------------------------------------------------
  # 4. Terraform Infrastructure as Code (IaC) Validation
  # --------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Lint & Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.0'

      - name: Check Terraform Formatting
        run: |
          cd infrastructure/terraform
          terraform fmt -check

      - name: Initialize Terraform
        run: |
          cd infrastructure/terraform
          terraform init -backend=false

      - name: Validate Terraform Syntax & Resources
        run: |
          cd infrastructure/terraform
          terraform validate

  # --------------------------------------------------------------------------
  # 5. Kubernetes Manifest Validation
  # --------------------------------------------------------------------------
  kubernetes-validate:
    name: Kustomize Manifest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Verify Kustomize Manifests
        run: |
          kubectl kustomize deploy/k8s/ > /dev/null
          echo "Kustomize templates render without errors."

  # --------------------------------------------------------------------------
  # 6. Container Image Build Verification
  # --------------------------------------------------------------------------
  container-build:
    name: Container Multi-stage Build Verification
    runs-on: ubuntu-latest
    needs: [gateway-test, agent-runtime-test, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent Runtime Docker Image
        uses: docker/build-push-action@v5
        with:
          context: agent-runtime
          file: agent-runtime/Dockerfile
          push: false
          tags: hyperroute-agent-runtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: hyperroute-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
